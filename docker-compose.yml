services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: llm-intern-journey-api:0.1.0
    container_name: llm-intern-journey-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      APP_ENV: development
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s